name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: apps/api
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run lint-imports
      - run: uv run pytest
      - run: uv run python scripts/export_openapi.py --check
      - name: Start PostgreSQL extensions
        working-directory: ${{ github.workspace }}
        run: docker compose up -d db --wait
      - run: uv run alembic upgrade head
      - run: uv run pytest -m integration
      - run: uv run alembic downgrade base && uv run alembic upgrade head
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build API image for production architecture (EC2 t4g, arm64) and amd64
        run: docker buildx build --platform linux/arm64,linux/amd64 .

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:dependencies
