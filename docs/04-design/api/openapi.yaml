openapi: 3.1.0
info:
  title: Gonarra API
  version: 1.0.5
  summary: Gonarra /v1 contract (REST + SSE) for the traveler app and operator endpoints.
  description: |
    Document ID GONARRA-API, version 1.0, status Draft (re-baseline DEC-013..021, 2026-11-06: Đà Nẵng only
    incl. the Hội An area; trust labels `VERIFIED` / `WEB_UNVERIFIED` on Stop, PlaceSummary, PlaceDetail and
    Citation; web stops with `web_source`; research and writing stages on the planning stream; calendar and
    web conflict types; `research_used` / `agent_run_id` on PlanPreview; Save acknowledgement for unverified
    stops (OQ-128); city-level Guide sessions (ADR-010 1.0) with `SEARCHING_WEB` and `ANSWERED_WEB_UNVERIFIED`).
    Previously version 0.4, status Draft. Owner Lê Ngọc Tấn Hiền; approver trantrongminh
    (pending). Date 2026-11-05 (0.3: curation `chunks[]` embedded on write, Guide Tier 1 evidence; SRC-100 A-028. 0.4: `City.centre`, curator
    queue and import-run fields, API-033 `import_run_id` filter; SRC-100 A-029). Produced with `design/apiDesign_prompt.md` v2.0 (kit commit `6996dae`).
    Narrative, rules and traceability: `docs/04-design/api/api-contract.md`.

    This contract is a superset of the generated `apps/api/openapi.json` (info.version 1.0.4): `/health`, `/ready`
    and `/v1/me` and their four schemas are kept unchanged apart from added `x-` extensions. Everything else is
    design, not implementation (SRC-100 A-020).

    Conventions: JSON field names are snake_case and match `docs/04-design/data/schema.sql` where they overlap.
    Every response carries `X-Request-ID`. Errors use the `ErrorResponse` envelope. Private resources owned by
    another account answer 404 `resource_not_found`. Mutating planning and curation calls take `Idempotency-Key`.

    History: 0.2 (2026-11-04) DA-GONARRA-01 fixes F-02, F-05 (deletion-status 401 semantics; booking partner enum).
    1.0.1 (2026-11-07): curator review surfaces withdrawn by DEC-022 (API-033, API-034, API-035, API-036, API-038, API-039, API-040, API-041, API-043, API-044, API-045, API-046, API-047, API-048, API-049, API-050, API-051, API-052, API-053, API-054, API-055, API-056, API-057, API-058, API-059, API-060, API-061, API-062, API-063); content is imported and
    published by the automated pipeline (`python -m app.cli pipeline run`). Kept: API-037 (owner emergency takedown)
    and API-042 (release-gate counts). `409 deletion_in_progress` listed on every authenticated /v1 route except
    API-006/API-007.
    1.0.2 (2026-11-08): `Leg.estimated` (boolean, default false) and Plan Health conflict type `LEG_ESTIMATED`
    with new severity `INFO` (owner demo without Google Routes: straight-line estimates, only when
    `GONARRA_ENVIRONMENT` is development, test or demo; INFO never changes `plan_health`). `Conflict.severity`
    enum gains `INFO`.
    1.0.3 (2026-11-08): review fixes and owner demo items. Public catalog reads: API-008 `listCities`,
    API-009 `listCategories`, API-010 `searchPlaces` and API-011 `getPlace` accept requests without a
    token (guests; `security: [{}, HTTPBearer]`); a token that is sent must still be valid (401). Content
    origin labels: `PlaceSummary.name_is_source_fallback` (EN name is the Vietnamese proper name reused
    unchanged) and `PlaceDetail.description_origin` (`SOURCE` | `AI_SUMMARY`). `PlanPreview.planning_preferences`
    (effective preferences the preview was generated with; reused by API-021 and copied to the trip on Save).
    `PlanPreview.assumptions` are stored as stable keys and rendered in the response locale. API-021
    `Idempotency-Key` replays the completed regeneration (`409 idempotency_key_reused` for another body).
    `City.code` is narrowed to `da-nang` (Đà Nẵng only, incl. the Hội An area; owner 2026-11-08).
    1.0.4 (2026-11-08): AI-extracted facts (DEC-028). `PlaceFact.origin` (`SOURCE` | `OWNER` |
    `AI_EXTRACTED`; absent means `SOURCE`) and `PlaceFact.grounding` (`STRONG` | `WEAK`, AI_EXTRACTED only, else
    null). An AI_EXTRACTED fact was extracted by Gonarra's grounded writer from the cited source (never
    invented); clients label it "Tóm tắt từ nguồn" / "Summarised from sources" and show the source link.
    ADMISSION_PRICE values may be `{free: true}` or `{currency, adult, child?, amount}`.
    1.0.4 clarifications (2026-11-09, descriptions and error codes only; no schema change): `OPENING_HOURS_UNKNOWN`
    is severity INFO (DEC-030); `VERIFIED` means published through the automated gate (DEC-022). API-006 answers
    `409 demo_account_not_deletable` for the shared demo account (demo builds only). A NUL character (U+0000) in
    any path, query parameter or JSON string answers `422 validation_error`; an unexpected server failure answers
    `500 internal_error` with the request id and never the exception text.
    1.0.5 (2026-11-09): DEC-031/DEC-032 retire AI-written catalog content. `PlaceSummary.is_area` marks an area
    (bay, peninsula, mountain range, old town): shown on the map and answered by the Guide, never a planner stop
    ('Add to trip' is disabled with 'Area — pick a place inside it'). `PlaceDetail.description_source` gives the
    attribution, licence and link of the displayed description (Wikivoyage CC BY-SA 4.0, Wikipedia, the owner
    sheet); `description_origin` is now `SOURCE` or null (`AI_SUMMARY` is retired and never served, and a place
    without a description shows 'No description yet'). `PlaceFact.origin` no longer produces `AI_EXTRACTED`.
servers:
  - url: https://api.example.invalid
    description: Placeholder; hostname pending OQ-039.
tags:
  - name: operations
    description: Liveness and readiness (CMP-014).
  - name: identity
    description: Account, preferences and deletion (CMP-004).
  - name: catalog
    description: Cities and published places (CMP-005).
  - name: trips
    description: Trips, saved itineraries and place cards (CMP-007, CMP-005).
  - name: planning
    description: Plan previews, edits, day regeneration and Save (CMP-008, CMP-007).
  - name: guide
    description: Grounded Guide sessions and photo identification (CMP-010, CMP-012).
  - name: stays
    description: Booking handoff and indicative stay prices (CMP-011, CMP-013).
  - name: study
    description: Pseudonymous study timing events (CMP-014, FR-077).
  - name: admin
    description: Operator-only endpoints (CMP-006, DEC-022) for emergency takedown and release-gate counts; require the operator (curator) role.

paths:
  /health:
    get:
      operationId: health_health_get
      x-api-id: API-001
      x-fr: []
      x-nfr: [NFR-008]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
          description: Successful Response
      summary: Health
      tags:
        - operations
  /ready:
    get:
      operationId: readiness_ready_get
      x-api-id: API-002
      x-fr: []
      x-nfr: [NFR-008]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
          description: Successful Response
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      summary: Readiness
      tags:
        - operations
  /v1/me:
    get:
      operationId: read_identity_v1_me_get
      x-api-id: API-003
      x-fr: [FR-068, FR-069]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      security:
        - HTTPBearer: []
      summary: Read Identity
      tags:
        - identity

  /v1/me/preferences:
    get:
      operationId: getPreferences
      x-api-id: API-004
      x-fr: [FR-073, FR-074, FR-075]
      summary: Read the traveler's saved preferences
      tags: [identity]
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: Saved preferences, or defaults when none were saved.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: putPreferences
      x-api-id: API-005
      x-fr: [FR-073, FR-074, FR-075]
      summary: Save preferences explicitly (full replace; naturally idempotent)
      description: Also records acknowledgement of the AI notice (FR-074) when `ai_notice_acknowledged` is true.
      tags: [identity]
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesWrite'
      responses:
        '200':
          description: Preferences stored.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/me/deletion:
    post:
      operationId: requestAccountDeletion
      x-api-id: API-006
      x-fr: [FR-071, FR-072]
      summary: Confirm account deletion and start the deletion job
      description: |
        Repeating the call while a job is REQUESTED or IN_PROGRESS returns the same job (idempotent by state).
        Private data is deleted within 24 h (ASM-010); a FAILED job is retried by the jobs runner.
      tags: [identity]
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '202':
          description: Deletion accepted; poll the status resource.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Location:
              description: /v1/me/deletion
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: getAccountDeletionStatus
      x-api-id: API-007
      x-fr: [FR-072]
      summary: Read the deletion status resource
      tags: [identity]
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: Current deletion status.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: After the Clerk user is deleted (last step), the token is rejected; a client that has observed IN_PROGRESS treats this 401 as COMPLETED (OQ-073).
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/cities:
    get:
      operationId: listCities
      x-api-id: API-008
      x-fr: [FR-001, FR-075]
      summary: List the enabled launch cities
      tags: [catalog]
      security:
        - {}
        - HTTPBearer: []
      x-public: true  # 1.0.3: guests allowed; a sent token must be valid (401 otherwise)
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Enabled cities (one at launch, `da-nang`, DEC-013; not paginated).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/categories:
    get:
      operationId: listCategories
      x-api-id: API-009
      x-fr: [FR-003, FR-021]
      summary: List place categories (interests in the preference form)
      tags: [catalog]
      security:
        - {}
        - HTTPBearer: []
      x-public: true  # 1.0.3: guests allowed; a sent token must be valid (401 otherwise)
      responses:
        '200':
          description: Categories ordered by sort_order.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/places:
    get:
      operationId: searchPlaces
      x-api-id: API-010
      x-fr: [FR-002, FR-004, FR-076]
      x-nfr: [NFR-001]
      summary: Search published places of a city
      description: |
        Matches Vietnamese name, English name or reviewed alias ignoring case and diacritics. Only places with a
        PUBLISHED catalog publication are returned (FR-004).
      tags: [catalog]
      security:
        - {}
        - HTTPBearer: []
      x-public: true  # 1.0.3: guests allowed; a sent token must be valid (401 otherwise)
      parameters:
        - name: city_id
          in: query
          required: false
          description: Optional; with neither city_id nor city_code the enabled city (`da-nang`) is used. A disabled or unknown city is a 422.
          schema:
            type: string
            format: uuid
        - name: city_code
          in: query
          required: false
          schema:
            type: string
        - name: area_code
          in: query
          required: false
          description: Restrict to one travel area (ADR-012), e.g. `hoi-an-old-town`.
          schema:
            type: string
        - name: bbox
          in: query
          required: false
          description: "`min_lng,min_lat,max_lng,max_lat` in WGS84."
          schema:
            type: string
        - name: near
          in: query
          required: false
          description: "`lat,lng`; combine with radius_m."
          schema:
            type: string
        - name: radius_m
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50000
            default: 1000
        - name: q
          in: query
          required: false
          description: Search text; omitted lists the city's places.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: category_code
          in: query
          required: false
          description: Accepted in any case; responses always use the UPPER_CASE schema code.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [relevance, name]
            default: relevance
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of matching places. A cursor reused with different filters is a 400 `invalid_cursor`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/places/{place_id}:
    get:
      operationId: getPlace
      x-api-id: API-011
      x-fr: [FR-003, FR-004, FR-005, FR-006, FR-007, FR-008, FR-076]
      summary: Read one published place with facts, freshness and attribution
      tags: [catalog]
      security:
        - {}
        - HTTPBearer: []
      x-public: true  # 1.0.3: guests allowed; a sent token must be valid (401 otherwise)
      parameters:
        - $ref: '#/components/parameters/PlaceId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Current publication of the place.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/trips:
    post:
      operationId: createTrip
      x-api-id: API-012
      x-fr: [FR-021, FR-023, FR-068]
      summary: Create a private draft trip (one city, 1–3 days)
      tags: [trips]
      security:
        - HTTPBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201':
          description: Draft trip created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Location:
              description: URL of the new trip.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: listTrips
      x-api-id: API-013
      x-fr: [FR-045, FR-068, FR-069]
      summary: List the caller's trips
      tags: [trips]
      security:
        - HTTPBearer: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TripStatus'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [-updated_at, start_date]
            default: -updated_at
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the caller's trips.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/trips/{trip_id}:
    get:
      operationId: getTrip
      x-api-id: API-014
      x-fr: [FR-045, FR-055, FR-069]
      x-nfr: [NFR-011]
      summary: Read a trip with its last saved itinerary
      tags: [trips]
      security:
        - HTTPBearer: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Trip, saved days/stops/legs and the active preview ID if any.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateTrip
      x-api-id: API-015
      x-fr: [FR-042, FR-069]
      summary: Update trip metadata (title) against an expected revision
      description: Itinerary content changes only through plan previews and Save (API-022).
      tags: [trips]
      security:
        - HTTPBearer: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdate'
      responses:
        '200':
          description: Updated trip.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteTrip
      x-api-id: API-016
      x-fr: [FR-046, FR-069]
      summary: Delete a trip (after client-side confirmation)
      description: Idempotent; deleting an already deleted trip answers 404, which clients treat as done.
      tags: [trips]
      security:
        - HTTPBearer: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: expected_revision
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '204':
          description: Trip, previews and stops deleted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/trips/{trip_id}/stops/{stop_id}/place-card:
    get:
      operationId: getPlaceCard
      x-api-id: API-017
      x-fr: [FR-051, FR-052, FR-053, FR-054, FR-005, FR-008]
      x-nfr: [NFR-011]
      summary: Place card for a stop of a saved itinerary
      description: |
        Combines the stop's pinned publication (names, Vietnamese address, entrance) with optional runtime live
        hours from Google Places (ADR-006). If the runtime provider fails, `live_status` is omitted and the card
        still answers 200 (NFR-011).
      tags: [trips]
      security:
        - HTTPBearer: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/StopId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Place card.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/trips/{trip_id}/plan-previews:
    post:
      operationId: createPlanPreview
      x-api-id: API-018
      x-fr: [FR-020, FR-021, FR-022, FR-023, FR-024, FR-025, FR-026, FR-027, FR-029, FR-030, FR-031, FR-043, FR-044, FR-069, FR-070]
      x-nfr: [NFR-002, NFR-003, NFR-036]
      summary: Generate a proposal, or open an edit preview of the saved itinerary
      description: |
        `source: GENERATE` runs candidate selection (Gemini), validation, routing (Google Routes) and scheduling
        (OR-Tools). `source: SAVED_ITINERARY` copies the saved itinerary into a new preview without any AI call.
        With `Accept: text/event-stream` progress is streamed (PlanningStreamEvent); otherwise one JSON body is
        returned. The result is persisted, so a dropped stream is resumed with API-019, not repeated.
