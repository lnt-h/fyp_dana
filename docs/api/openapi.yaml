openapi: 3.1.0
info:
  title: Gonarra API
  version: 0.4.0
  summary: Gonarra /v1 contract (REST + SSE) for the traveler app and the curator SPA.
  description: |
    Document ID GONARRA-API, version 0.4, status Draft. Owner Lê Ngọc Tấn Hiền; approver trantrongminh
    (pending). Date 2026-11-05 (0.3: curation `chunks[]` embedded on write, Guide Tier 1 evidence; SRC-100 A-028. 0.4: `City.centre`, curator
    queue and import-run fields, API-033 `import_run_id` filter; SRC-100 A-029). Produced with `design/apiDesign_prompt.md` v2.0 (kit commit `6996dae`, adapted copy
    `docs/00-governance/prompt-templates/design/apiDesign_prompt.md`). Narrative, rules and traceability: `docs/04-design/api/api-contract.md`.

    This contract is a superset of the generated `apps/api/openapi.json` (info.version 0.1.0): `/health`, `/ready`
    and `/v1/me` and their four schemas are kept unchanged apart from added `x-` extensions. Everything else is
    design, not implementation (SRC-100 A-020).

    Conventions: JSON field names are snake_case and match `docs/04-design/data/schema.sql` where they overlap.
    Every response carries `X-Request-ID`. Errors use the `ErrorResponse` envelope. Private resources owned by
    another account answer 404 `not_found`. Mutating planning and curation calls take `Idempotency-Key`.

    History: 0.2 (2026-11-04) DA-GONARRA-01 fixes F-02, F-05 (deletion-status 401 semantics; booking partner enum).
servers:
  - url: https://api.example.invalid
    description: Placeholder; hostname pending OQ-039.
tags:
  - name: operations
    description: Liveness and readiness (CMP-014).
  - name: identity
    description: Account, preferences and deletion (CMP-004).
  - name: catalog
    description: Cities and published places (CMP-005).
  - name: trips
    description: Trips, saved itineraries and place cards (CMP-007, CMP-005).
  - name: planning
    description: Plan previews, edits, day regeneration and Save (CMP-008, CMP-007).
  - name: guide
    description: Grounded Guide sessions and photo identification (CMP-010, CMP-012).
  - name: stays
    description: Booking handoff and indicative stay prices (CMP-011, CMP-013).
  - name: study
    description: Pseudonymous study timing events (CMP-014, FR-077).
  - name: admin
    description: Curator-only endpoints (CMP-006); require the curator role claim.

paths:
  /health:
    get:
      operationId: health_health_get
      x-api-id: API-001
      x-fr: []
      x-nfr: [NFR-008]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
          description: Successful Response
      summary: Health
      tags:
        - operations
  /ready:
    get:
      operationId: readiness_ready_get
      x-api-id: API-002
      x-fr: []
      x-nfr: [NFR-008]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
          description: Successful Response
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      summary: Readiness
      tags:
        - operations
  /v1/me:
    get:
      operationId: read_identity_v1_me_get
      x-api-id: API-003
      x-fr: [FR-068, FR-069]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      security:
        - HTTPBearer: []
      summary: Read Identity
      tags:
        - identity

  /v1/me/preferences:
    get:
      operationId: getPreferences
      x-api-id: API-004
      x-fr: [FR-073, FR-074, FR-075]
      summary: Read the traveler's saved preferences
      tags: [identity]
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: Saved preferences, or defaults when none were saved.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: putPreferences
      x-api-id: API-005
      x-fr: [FR-073, FR-074, FR-075]
      summary: Save preferences explicitly (full replace; naturally idempotent)
      description: Also records acknowledgement of the AI notice (FR-074) when `ai_notice_acknowledged` is true.
      tags: [identity]
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesWrite'
      responses:
        '200':
          description: Preferences stored.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/me/deletion:
    post:
      operationId: requestAccountDeletion
      x-api-id: API-006
      x-fr: [FR-071, FR-072]
      summary: Confirm account deletion and start the deletion job
      description: |
        Repeating the call while a job is REQUESTED or IN_PROGRESS returns the same job (idempotent by state).
        Private data is deleted within 24 h (ASM-010); a FAILED job is retried by the jobs runner.
      tags: [identity]
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '202':
          description: Deletion accepted; poll the status resource.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Location:
              description: /v1/me/deletion
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: getAccountDeletionStatus
      x-api-id: API-007
      x-fr: [FR-072]
      summary: Read the deletion status resource
      tags: [identity]
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: Current deletion status.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: After the Clerk user is deleted (last step), the token is rejected; a client that has observed IN_PROGRESS treats this 401 as COMPLETED (OQ-073).
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/cities:
    get:
      operationId: listCities
      x-api-id: API-008
      x-fr: [FR-001, FR-075]
      summary: List the enabled launch cities
      tags: [catalog]
      security:
        - HTTPBearer: []
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Enabled cities (five at launch; not paginated).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/categories:
    get:
      operationId: listCategories
      x-api-id: API-009
      x-fr: [FR-003, FR-021]
      summary: List place categories (interests in the preference form)
      tags: [catalog]
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: Categories ordered by sort_order.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/places:
    get:
      operationId: searchPlaces
      x-api-id: API-010
      x-fr: [FR-002, FR-004, FR-076]
      x-nfr: [NFR-001]
      summary: Search published places of a city
      description: |
        Matches Vietnamese name, English name or reviewed alias ignoring case and diacritics. Only places with a
        PUBLISHED catalog publication are returned (FR-004).
      tags: [catalog]
      security:
        - HTTPBearer: []
      parameters:
        - name: city_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Search text; omitted lists the city's places.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: category_code
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [relevance, name]
            default: relevance
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of matching places.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/places/{place_id}:
    get:
      operationId: getPlace
      x-api-id: API-011
      x-fr: [FR-003, FR-004, FR-005, FR-006, FR-007, FR-008, FR-076]
      summary: Read one published place with facts, freshness and attribution
      tags: [catalog]
      security:
        - HTTPBearer: []
      parameters:
        - $ref: '#/components/parameters/PlaceId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Current publication of the place.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/trips:
    post:
      operationId: createTrip
      x-api-id: API-012
      x-fr: [FR-021, FR-023, FR-068]
      summary: Create a private draft trip (one city, 1–3 days)
      tags: [trips]
      security:
        - HTTPBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201':
          description: Draft trip created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Location:
              description: URL of the new trip.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: listTrips
      x-api-id: API-013
      x-fr: [FR-045, FR-068, FR-069]
      summary: List the caller's trips
      tags: [trips]
      security:
        - HTTPBearer: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TripStatus'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [-updated_at, start_date]
            default: -updated_at
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the caller's trips.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/trips/{trip_id}:
    get:
      operationId: getTrip
      x-api-id: API-014
      x-fr: [FR-045, FR-055, FR-069]
      x-nfr: [NFR-011]
      summary: Read a trip with its last saved itinerary
      tags: [trips]
      security:
        - HTTPBearer: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Trip, saved days/stops/legs and the active preview ID if any.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateTrip
      x-api-id: API-015
      x-fr: [FR-042, FR-069]
      summary: Update trip metadata (title) against an expected revision
      description: Itinerary content changes only through plan previews and Save (API-022).
      tags: [trips]
      security:
        - HTTPBearer: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdate'
      responses:
        '200':
          description: Updated trip.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteTrip
      x-api-id: API-016
      x-fr: [FR-046, FR-069]
      summary: Delete a trip (after client-side confirmation)
      description: Idempotent; deleting an already deleted trip answers 404, which clients treat as done.
      tags: [trips]
      security:
        - HTTPBearer: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: expected_revision
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '204':
          description: Trip, previews and stops deleted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/trips/{trip_id}/stops/{stop_id}/place-card:
    get:
      operationId: getPlaceCard
      x-api-id: API-017
      x-fr: [FR-051, FR-052, FR-053, FR-054, FR-005, FR-008]
      x-nfr: [NFR-011]
      summary: Place card for a stop of a saved itinerary
      description: |
        Combines the stop's pinned publication (names, Vietnamese address, entrance) with optional runtime live
        hours from Google Places (ADR-006). If the runtime provider fails, `live_status` is omitted and the card
        still answers 200 (NFR-011).
      tags: [trips]
      security:
        - HTTPBearer: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/StopId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Place card.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/trips/{trip_id}/plan-previews:
    post:
      operationId: createPlanPreview
      x-api-id: API-018
      x-fr: [FR-020, FR-021, FR-022, FR-023, FR-024, FR-025, FR-026, FR-027, FR-029, FR-030, FR-031, FR-043, FR-044, FR-069, FR-070]
      x-nfr: [NFR-002, NFR-003, NFR-036]
      summary: Generate a proposal, or open an edit preview of the saved itinerary
      description: |
        `source: GENERATE` runs candidate selection (Gemini), validation, routing (Google Routes) and scheduling
        (OR-Tools). `source: SAVED_ITINERARY` copies the saved itinerary into a new preview without any AI call.
        With `Accept: text/event-stream` progress is streamed (PlanningStreamEvent); otherwise one JSON body is
        returned. The result is persisted, so a dropped stream is resumed with API-019, not repeated.
        Owner, scope (≤ 3 days, one launch city) and quota are checked before any external call (FR-023, FR-069).
      tags: [planning]
      security:
        - HTTPBearer: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanPreviewCreate'
            examples:
              ha02:
                summary: HA-02 two days in Hội An (synthetic)
                value:
                  source: GENERATE
                  expected_trip_revision: 0
                  locale: vi
                  request_text: Hai ngày ở Hội An, đi bộ là chính, thích di tích.
                  preferences:
                    pace: BALANCED
                    interest_category_codes: [heritage]
                    allowed_modes: [WALK, DRIVE]
                    day_start_time: '08:00'
                    day_end_time: '18:00'
                    must_see_place_ids: []
      responses:
        '200':
          description: Clarification needed (FR-022); no preview was created and no AI call was made for generation.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationRequired'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/PlanningStreamEvent'
        '201':
          description: Preview created (JSON mode).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Location:
              description: /v1/plan-previews/{preview_id}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/plan-previews/{preview_id}:
    get:
      operationId: getPlanPreview
      x-api-id: API-019
      x-fr: [FR-027, FR-028, FR-029, FR-030, FR-031, FR-040, FR-044, FR-069]
      summary: Read a preview at its head revision or a named revision
      tags: [planning]
      security:
        - HTTPBearer: []
      parameters:
        - $ref: '#/components/parameters/PreviewId'
        - name: revision
          in: query
          required: false
          description: Preview revision to read; default head_revision.
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Preview revision (timeline and map read the same revision, FR-028).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: editPlanPreview
      x-api-id: API-020
      x-fr: [FR-033, FR-034, FR-035, FR-036, FR-037, FR-038, FR-039, FR-047, FR-044, FR-069]
      x-nfr: [NFR-004]
      summary: Apply edits and append a recalculated preview revision
      description: |
        Edits are applied in order to `expected_revision`; affected legs are re-routed and the day re-scheduled,
        then Plan Health is recomputed. No AI call. A stale `expected_revision` answers 409 `revision_conflict`.
      tags: [planning]
      security:
        - HTTPBearer: []
      parameters:
        - $ref: '#/components/parameters/PreviewId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanPreviewEdit'
      responses:
        '200':
          description: New head revision.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: discardPlanPreview
      x-api-id: API-023
      x-fr: [FR-040, FR-069]
      summary: Discard an unsaved preview (status DISCARDED)
      description: Idempotent; the saved itinerary is not touched.
      tags: [planning]
      security:
        - HTTPBearer: []
      parameters:
        - $ref: '#/components/parameters/PreviewId'
      responses:
        '204':
          description: Discarded.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/plan-previews/{preview_id}/regenerate:
    post:
      operationId: regeneratePlanDay
      x-api-id: API-021
      x-fr: [FR-047, FR-048, FR-049, FR-050, FR-043, FR-044, FR-069, FR-070]
      x-nfr: [NFR-002, NFR-036]
      summary: Regenerate one day, keeping other days and locked stops
      description: |
