      x-fr: [FR-016, FR-012]
      x-nfr: [NFR-015]
      summary: Register a source with licence and attribution text
      tags: [admin]
      security:
        - HTTPBearer: [curator]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceCreate'
      responses:
        '201':
          description: Source created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/admin/cities/summary:
    get:
      operationId: adminGetCitySummary
      x-api-id: API-042
      x-fr: [FR-018]
      x-nfr: [NFR-015]
      summary: Count published places and candidates per launch city
      tags: [admin]
      security:
        - HTTPBearer: [curator]
      responses:
        '200':
          description: Counts per city.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitySummaryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http

  headers:
    XRequestID:
      description: Request correlation ID; echoes a client-supplied X-Request-ID or a server-generated one.
      schema:
        type: string
        maxLength: 64
    RetryAfter:
      description: Seconds until the quota window resets or the provider may be retried.
      schema:
        type: integer
        minimum: 1
    IdempotentReplayed:
      description: '"true" when the response is a stored replay of an earlier request with the same Idempotency-Key.'
      schema:
        type: string
        enum: ['true', 'false']

  parameters:
    TripId:
      name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StopId:
      name: stop_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PreviewId:
      name: preview_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlaceId:
      name: place_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Locale:
      name: locale
      in: query
      required: false
      description: Content language; defaults to the account preference, then vi. Vietnamese names are always returned (FR-076).
      schema:
        $ref: '#/components/schemas/Locale'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's next_cursor.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID; scoped by account and operation; retained 24 h (ASM-071).
      schema:
        type: string
        format: uuid
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID; scoped by account and operation; retained 24 h (ASM-071).
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Malformed request or invalid cursor (`bad_request`, `invalid_cursor`).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, expired or foreign-issuer token (`unauthenticated`).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthenticated:
              value:
                error:
                  code: unauthenticated
                  message: Sign in again.
                  retryable: false
                  request_id: req_example_0001
                  context: {}
    Forbidden:
      description: Authenticated but not allowed (`curator_role_required`, `not_study_participant`).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource absent or owned by another account (`not_found`); ownership is not disclosed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: |
        `revision_conflict` (context.current_revision), `idempotency_key_reused` (same key, different body),
        `idempotency_in_progress`, `plan_blocked` (context.reasons), `trip_not_saved`, `deletion_in_progress`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            revisionConflict:
              value:
                error:
                  code: revision_conflict
                  message: The trip changed since this preview was opened.
                  retryable: false
                  request_id: req_example_0002
                  context:
                    expected_trip_revision: 1
                    current_revision: 2
    Gone:
      description: Preview EXPIRED, DISCARDED or already SAVED (`preview_expired`, `preview_closed`).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: |
        Body or parameter invalid (`validation_failed`, context.fields), out of scope (`unsupported_request`:
        > 3 days, several cities, city not launched — FR-023), `place_not_in_city`, `publication_incomplete`
        (context.missing).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unsupported:
              value:
                error:
                  code: unsupported_request
                  message: Gonarra plans 1 to 3 days in one launch city.
                  retryable: false
                  request_id: req_example_0003
                  context:
                    day_count: 5
                    max_day_count: 3
    PayloadTooLarge:
      description: Image larger than the upload limit (`payload_too_large`).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Image type not JPEG/PNG/WebP (`unsupported_media_type`).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Per-owner quota exhausted (`quota_exceeded`, context.quota and context.resets_at).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: |
        Dependency unavailable (`ai_unavailable`, `route_unavailable`, `runtime_place_unavailable`,
        `price_provider_unavailable`, `database_unavailable`, `feature_disabled`); retryable flag set accordingly.
        Saved itinerary and the last preview are unchanged (FR-043, FR-044).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ---- Unchanged from apps/api/openapi.json ----
    ErrorDetail:
      properties:
        code:
          title: Code
          type: string
        context:
          additionalProperties: true
          title: Context
          type: object
        message:
          title: Message
          type: string
        request_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Request Id
        retryable:
          default: false
          title: Retryable
          type: boolean
      required:
        - code
        - message
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
        - error
      title: ErrorResponse
      type: object
    IdentityResponse:
      properties:
        account_id:
          format: uuid
          title: Account Id
          type: string
        session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Session Id
        subject:
          title: Subject
          type: string
      required:
        - account_id
        - subject
      title: IdentityResponse
      type: object
    ServiceStatus:
      properties:
        service:
          default: gonarra-api
          title: Service
          type: string
        status:
          title: Status
          type: string
      required:
        - status
      title: ServiceStatus
      type: object

    # ---- Shared value types ----
    Locale:
      type: string
      enum: [vi, en]
    TravelMode:
      type: string
      enum: [WALK, DRIVE]
    Pace:
      type: string
      enum: [RELAXED, BALANCED, PACKED]
    TripStatus:
      type: string
      enum: [DRAFT, SAVED]
    PlanHealth:
      type: string
      enum: [GOOD, WARNING, BLOCKED]
    KnowledgeState:
      type: string
      enum: [KNOWN, UNKNOWN, NOT_APPLICABLE]
    Freshness:
      type: string
      description: STALE when verified_at is more than stale_after_days (180, ASM-008) before today.
      enum: [CURRENT, STALE]
    WorkflowState:
      type: string
      enum: [IMPORTED, MATCH_REVIEW, CONTENT_REVIEW, READY_TO_PUBLISH, PUBLISHED, RETIRED]
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    LocalTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      examples: ['08:00']
    Attribution:
      type: object
      required: [publisher, attribution_text]
      properties:
        publisher:
          type: string
        attribution_text:
          type: string
        license_code:
          type: [string, 'null']
        homepage_url:
          type: [string, 'null']
          format: uri
    Citation:
      type: object
      required: [source_revision_id, publisher, verified_at]
      properties:
        source_revision_id:
          type: string
          format: uuid
        knowledge_chunk_id:
          type: [string, 'null']
          format: uuid
        section:
          type: [string, 'null']
          description: Section of the cited chunk (ADR-010 0.3); null for a fact citation.
          enum: [OVERVIEW, HISTORY, HIGHLIGHTS, VISIT_TIPS, ETIQUETTE, ACCESS, null]
        place_fact_id:
          type: [string, 'null']
          format: uuid
        publisher:
          type: string
        title:
          type: [string, 'null']
        locator:
          type: [string, 'null']
        verified_at:
          type: string
          format: date
    PageInfo:
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, 'null']
          description: Null on the last page.

    # ---- Identity ----
    Preferences:
      type: object
      required: [locale, allowed_modes, interest_category_codes]
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        pace:
          oneOf:
            - $ref: '#/components/schemas/Pace'
            - type: 'null'
        interest_category_codes:
          type: array
          items:
            type: string
        allowed_modes:
          type: array
          items:
            $ref: '#/components/schemas/TravelMode'
        day_start_time:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        day_end_time:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        ai_notice_acknowledged_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
    PreferencesWrite:
      type: object
      additionalProperties: false
      required: [locale, allowed_modes, interest_category_codes]
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        pace:
          oneOf:
            - $ref: '#/components/schemas/Pace'
            - type: 'null'
        interest_category_codes:
          type: array
          maxItems: 20
          items:
            type: string
        allowed_modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TravelMode'
        day_start_time:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        day_end_time:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        ai_notice_acknowledged:
          type: boolean
          description: Set true once the FR-074 notice is shown; the server stamps ai_notice_acknowledged_at.
    AccountDeletionRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: boolean
          const: true
    AccountDeletionStatus:
      type: object
      required: [id, status, requested_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [REQUESTED, IN_PROGRESS, COMPLETED, FAILED]
        attempt_count:
          type: integer
          minimum: 0
        failure_reason:
          type: [string, 'null']
        requested_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time

    # ---- Catalog ----
    City:
      type: object
      required: [id, code, name_vi, name_en, time_zone]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name_vi:
          type: string
        name_en:
          type: string
        time_zone:
          type: string
          examples: [Asia/Ho_Chi_Minh]
        centre:
          description: Map centre for a day or view with no stops (OQ-109); centroid of `cities.boundary`, null when no boundary is recorded.
          oneOf:
            - $ref: '#/components/schemas/GeoPoint'
            - type: 'null'
    CityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/City'
    Category:
      type: object
      required: [code, name_vi, name_en, sort_order]
      properties:
        code:
          type: string
        name_vi:
          type: string
        name_en:
          type: string
        sort_order:
          type: integer
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PlaceSummary:
      type: object
      required: [id, city_id, slug, category_code, name_vi, name, location, catalog_publication_id]
      properties:
        id:
          type: string
          format: uuid
        city_id:
          type: string
          format: uuid
        slug:
          type: string
        category_code:
          type: string
        name_vi:
          type: string
          description: Vietnamese name, always present (FR-076).
        name:
          type: string
          description: Name in the requested locale.
        short_description:
          type: [string, 'null']
        location:
          $ref: '#/components/schemas/GeoPoint'
        visit_minutes_suggested:
          type: [integer, 'null']
        catalog_publication_id:
          type: string
          format: uuid
        thumbnail:
          oneOf:
            - $ref: '#/components/schemas/Media'
            - type: 'null'
    PlaceSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PlaceSummary'
    Media:
      type: object
      required: [media_asset_id, url, attribution_text]
      properties:
        media_asset_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        width_px:
          type: [integer, 'null']
        height_px:
          type: [integer, 'null']
        alt_text:
          type: [string, 'null']
        creator:
          type: [string, 'null']
        license_code:
          type: string
        attribution_text:
          type: string
    PlaceFact:
      type: object
      description: One operational fact. UNKNOWN is never collapsed into an empty value (FR-006).
      required: [field_code, knowledge_state, freshness, sources]
      properties:
        place_fact_id:
          type: string
          format: uuid
        field_code:
          type: string
          examples: [opening_hours]
        knowledge_state:
          $ref: '#/components/schemas/KnowledgeState'
        value:
          description: Present only when knowledge_state is KNOWN; shape depends on fact_fields.value_kind.
          type: [object, string, 'null']
        verified_at:
          type: [string, 'null']
          format: date
        valid_until:
          type: [string, 'null']
          format: date
        freshness:
          $ref: '#/components/schemas/Freshness'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
    PlaceDetail:
      allOf:
        - $ref: '#/components/schemas/PlaceSummary'
        - type: object
          required: [name_en, facts, attributions, publication_revision]
          properties:
            name_en:
              type: string
            description:
              type: [string, 'null']
            visit_minutes_min:
              type: [integer, 'null']
            visit_minutes_max:
              type: [integer, 'null']
            entrance_location:
              oneOf:
                - $ref: '#/components/schemas/GeoPoint'
                - type: 'null'
            publication_revision:
              type: integer
            published_at:
              type: string
              format: date-time
            facts:
              type: array
              items:
                $ref: '#/components/schemas/PlaceFact'
            media:
              type: array
              items:
                $ref: '#/components/schemas/Media'
            attributions:
              type: array
              description: Every source whose data is shown (FR-008).
              items:
                $ref: '#/components/schemas/Attribution'

    # ---- Trips ----
    TripCreate:
      type: object
      additionalProperties: false
      required: [city_id, start_date, day_count]
      properties:
        city_id:
          type: string
          format: uuid
        title:
          type: [string, 'null']
          maxLength: 120
        start_date:
          type: string
          format: date
        day_count:
          type: integer
          minimum: 1
          maximum: 3
    TripUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          minimum: 0
        title:
          type: [string, 'null']
          maxLength: 120
    Trip:
      type: object
      required: [id, city_id, start_date, day_count, status, revision, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        city_id:
          type: string
          format: uuid
        title:
          type: [string, 'null']
        start_date:
          type: string
          format: date
        day_count:
          type: integer
          minimum: 1
          maximum: 3
        status:
          $ref: '#/components/schemas/TripStatus'
        revision:
          type: integer
          minimum: 0
        saved_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TripPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Trip'
    TripDetail:
      allOf:
        - $ref: '#/components/schemas/Trip'
        - type: object
          required: [days]
          properties:
            planning_preferences:
              oneOf:
                - $ref: '#/components/schemas/PlanningPreferences'
                - type: 'null'
            days:
              type: array
              description: Saved itinerary; empty for a DRAFT trip.
              items:
                $ref: '#/components/schemas/ItineraryDay'
            active_preview_id:
              type: [string, 'null']
              format: uuid
    ItineraryDay:
      type: object
      required: [day_index, stops, legs]
      properties:
        trip_day_id:
          type: [string, 'null']
          format: uuid
          description: Null inside a preview snapshot.
        day_index:
          type: integer
          minimum: 1
          maximum: 3
        day_window_start:
          $ref: '#/components/schemas/LocalTime'
        day_window_end:
          $ref: '#/components/schemas/LocalTime'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Stop'
        legs:
          type: array
          items:
            $ref: '#/components/schemas/Leg'
    Stop:
      type: object
      required: [id, place_id, catalog_publication_id, ordinal, visit_minutes, is_locked, name_vi, name, location]
      properties:
        id:
          type: string
          format: uuid
          description: Stable across preview revisions and into the saved trip_stops row.
        place_id:
          type: string
          format: uuid
        catalog_publication_id:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 1
        planned_arrival:
          type: [string, 'null']
          format: date-time
        planned_departure:
          type: [string, 'null']
          format: date-time
        visit_minutes:
          type: integer
          minimum: 5
        is_locked:
          type: boolean
        name_vi:
          type: string
        name:
          type: string
        location:
          $ref: '#/components/schemas/GeoPoint'
        rationale:
          type: [string, 'null']
          description: AI-written reason for the selection (preview only).
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
    Leg:
      type: object
      required: [from_stop_id, to_stop_id, travel_mode, availability]
      properties:
        from_stop_id:
          type: string
          format: uuid
        to_stop_id:
          type: string
          format: uuid
        travel_mode:
          $ref: '#/components/schemas/TravelMode'
        availability:
          type: string
          enum: [AVAILABLE, UNAVAILABLE, EXPIRED]
        distance_m:
          type: [integer, 'null']
        duration_s:
          type: [integer, 'null']
        measured_at:
          type: [string, 'null']
          format: date-time
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
    Conflict:
      type: object
      required: [type, severity]
      properties:
        type:
          type: string
          enum: [CLOSED_AT_PLANNED_TIME, LEG_UNAVAILABLE, DAY_WINDOW_EXCEEDED, OPENING_HOURS_UNKNOWN, FACT_STALE, MUST_SEE_NOT_INCLUDED]
        severity:
          type: string
          enum: [BLOCKING, WARNING]
        message:
          type: string
    PlaceCard:
      type: object
      required: [stop_id, place_id, name_vi, name_en, address_vi, entrance, directions]
      properties:
        stop_id:
          type: string
          format: uuid
        place_id:
          type: string
          format: uuid
        catalog_publication_id:
          type: string
          format: uuid
        name_vi:
          type: string
        name_en:
          type: string
        address_vi:
          description: Vietnamese address for a driver, or UNKNOWN (FR-052).
          $ref: '#/components/schemas/PlaceFact'
        entrance:
          description: Verified entrance location, or UNKNOWN (FR-053).
          $ref: '#/components/schemas/PlaceFact'
        directions:
          type: object
          required: [target, google_maps_url, apple_maps_url]
          properties:
            target:
              type: string
              enum: [ENTRANCE, PLACE_POSITION]
            google_maps_url:
              type: string
              format: uri
            apple_maps_url:
              type: string
              format: uri
        live_status:
          description: Runtime-only Google Places data; omitted when unavailable (ADR-006).
          type: object
          required: [retrieved_at, attribution_text]
          properties:
            open_now:
              type: [boolean, 'null']
            retrieved_at:
              type: string
              format: date-time
            attribution_text:
              type: string
        attributions:
          type: array
          items:
            $ref: '#/components/schemas/Attribution'

    # ---- Planning ----
    PlanningPreferences:
      type: object
      additionalProperties: false
      properties:
        pace:
          $ref: '#/components/schemas/Pace'
        interest_category_codes:
          type: array
          maxItems: 20
          items:
            type: string
        allowed_modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TravelMode'
        day_start_time:
          $ref: '#/components/schemas/LocalTime'
        day_end_time:
          $ref: '#/components/schemas/LocalTime'
        must_see_place_ids:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
    PlanPreviewCreate:
      type: object
      additionalProperties: false
      required: [source, expected_trip_revision, locale]
      properties:
        source:
          type: string
          enum: [GENERATE, SAVED_ITINERARY]
        expected_trip_revision:
          type: integer
          minimum: 0
        locale:
          $ref: '#/components/schemas/Locale'
        request_text:
          type: [string, 'null']
          maxLength: 1000
          description: Free-text request (FR-020); sent to Gemini without identifiers.
        preferences:
          $ref: '#/components/schemas/PlanningPreferences'
    ClarificationRequired:
      type: object
      required: [outcome, missing_fields, message]
      properties:
        outcome:
          type: string
          const: CLARIFICATION_REQUIRED
        missing_fields:
          type: array
          items:
            type: string
            enum: [city, start_date, day_count]
        message:
          type: string
    PlanPreview:
      type: object
      required: [id, trip_id, base_trip_revision, head_revision, preview_revision, status, origin, plan_health, expires_at, days]
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        base_trip_revision:
          type: integer
        head_revision:
          type: integer
        preview_revision:
          type: integer
          description: Revision represented by this body.
        parent_revision:
          type: [integer, 'null']
        status:
          type: string
          enum: [ACTIVE, SAVED, DISCARDED, EXPIRED]
        origin:
          type: string
          enum: [GENERATED, MANUAL_EDIT, DAY_REGENERATED, REPAIRED]
        plan_health:
          $ref: '#/components/schemas/PlanHealth'
        health_reasons:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
        expires_at:
          type: string
          format: date-time
        days:
          type: array
          items:
            $ref: '#/components/schemas/ItineraryDay'
        assumptions:
          type: array
          items:
            type: string
        model_version:
          type: [string, 'null']
        prompt_version:
          type: [string, 'null']
        corpus_revision:
          type: [integer, 'null']
        created_at:
          type: string
          format: date-time
    PreviewEditOperation:
      type: object
      additionalProperties: false
      required: [op]
      properties:
        op:
          type: string
          enum: [MOVE_STOP, ADD_STOP, REMOVE_STOP, REPLACE_STOP, SET_VISIT_MINUTES, SET_LEG_MODE, LOCK_STOP, UNLOCK_STOP]
        stop_id:
          type: string
          format: uuid
        day_index:
          type: integer
          minimum: 1
          maximum: 3
        to_ordinal:
          type: integer
          minimum: 1
        place_id:
          type: string
          format: uuid
          description: ADD_STOP / REPLACE_STOP; must be published in the trip's city.
        visit_minutes:
          type: integer
          minimum: 5
          maximum: 600
        from_stop_id:
          type: string
          format: uuid
        to_stop_id:
          type: string
          format: uuid
        travel_mode:
          $ref: '#/components/schemas/TravelMode'
    PlanPreviewEdit:
      type: object
      additionalProperties: false
      required: [expected_revision, edits]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        edits:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/PreviewEditOperation'
    RegenerateDayRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, day_index]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        day_index:
          type: integer
          minimum: 1
          maximum: 3
        locked_stop_ids:
          type: array
          description: Stops to keep; merged with stops already is_locked in the revision.
          items:
            type: string
            format: uuid
        instruction:
          type: [string, 'null']
          maxLength: 500
        locale:
          $ref: '#/components/schemas/Locale'
    AcceptPreviewRequest:
      type: object
      additionalProperties: false
      required: [expected_preview_revision, expected_trip_revision]
      properties:
        expected_preview_revision:
          type: integer
          minimum: 1
        expected_trip_revision:
          type: integer
          minimum: 0
    PlanningStreamEvent:
      type: object
      description: |
        One SSE `data:` payload; the SSE `event:` name equals `type`. Terminal events are preview_ready,
        clarification_required and error.
      required: [type]
      properties:
        type:
          type: string
          enum: [progress, clarification_required, preview_ready, error]
        stage:
          type: string
          enum: [VALIDATING_REQUEST, SELECTING_PLACES, ROUTING, SCHEDULING, CHECKING_HEALTH]
        preview_id:
          type: string
          format: uuid
        preview_revision:
          type: integer
        plan_health:
          $ref: '#/components/schemas/PlanHealth'
        clarification:
          $ref: '#/components/schemas/ClarificationRequired'
        error:
          $ref: '#/components/schemas/ErrorDetail'

    # ---- Guide ----
    GuideSessionCreate:
      type: object
      additionalProperties: false
      required: [place_id, locale]
      properties:
        place_id:
          type: string
          format: uuid
        trip_id:
          type: [string, 'null']
          format: uuid
        locale:
          $ref: '#/components/schemas/Locale'
    GuideSession:
      type: object
      required: [id, place_id, locale, created_at]
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: [string, 'null']
          format: uuid
        place_id:
          type: string
          format: uuid
        locale:
          $ref: '#/components/schemas/Locale'
        expires_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
    GuideQuestion:
      type: object
      additionalProperties: false
      required: [content, input_mode]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
        input_mode:
          type: string
          enum: [TEXT, VOICE_TRANSCRIPT]
    GuideMessage:
      type: object
      required: [id, seq, role, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
          minimum: 1
        role:
          type: string
          enum: [TRAVELER, ASSISTANT]
        input_mode:
          type: [string, 'null']
          enum: [TEXT, VOICE_TRANSCRIPT, PHOTO, null]
        content:
          type: string
        answer_status:
          type: [string, 'null']
          enum: [ANSWERED, INSUFFICIENT_EVIDENCE, NOT_RECOGNISED, null]
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        created_at:
          type: string
          format: date-time
    GuideMessagePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/GuideMessage'
    GuideStreamEvent:
      type: object
      description: |
        One SSE `data:` payload; `event:` equals `type`. `text` carries an incremental delta; `result` is terminal
        and carries the stored assistant message; `error` is terminal.
      required: [type]
      properties:
        type:
          type: string
          enum: [progress, text, result, error]
        stage:
          type: string
          enum: [RETRIEVING, ANSWERING]
        delta:
          type: string
        message:
          $ref: '#/components/schemas/GuideMessage'
        error:
          $ref: '#/components/schemas/ErrorDetail'
    PhotoIdentificationUpload:
      type: object
      required: [image, latitude, longitude, locale]
      properties:
        image:
          type: string
          contentMediaType: image/jpeg
          description: JPEG, PNG or WebP with metadata stripped on device; size limit per ASM-070.
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracy_m:
          type: number
          minimum: 0
        locale:
          $ref: '#/components/schemas/Locale'
        session_id:
          type: string
          format: uuid
          description: Optional Guide session; the outcome is stored as a PHOTO message without image or coordinates.
    PhotoIdentificationResult:
      type: object
      required: [outcome, radius_m]
      properties:
        outcome:
          type: string
          enum: [IDENTIFIED, NOT_RECOGNISED]
        radius_m:
          type: integer
          const: 300
        place:
          oneOf:
            - $ref: '#/components/schemas/PlaceSummary'
            - type: 'null'

    # ---- Stays ----
    HandoffKind:
      type: string
      enum: [STAY, ACTIVITY, TRANSPORT]
    HandoffLink:
      type: object
      required: [kind, partner_key, partner_display_name, url]
      properties:
        kind:
          $ref: '#/components/schemas/HandoffKind'
        partner_key:
          type: string
          enum: [agoda, booking_com, klook, twelve_go]
          description: 'STAY: agoda | booking_com; ACTIVITY: klook; TRANSPORT: twelve_go (BRD §14). Partners: Agoda, Booking.com, Klook, 12Go.'
        partner_display_name:
          type: string
        url:
          type: string
          format: uri
        city_id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    StayPrice:
      type: object
      required: [name, price, retrieved_at, provider_key]
      properties:
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        price_basis:
          type: string
          enum: [PER_NIGHT, TOTAL_STAY]
        provider_key:
          type: string
        handoff_url:
          type: [string, 'null']
          format: uri
        retrieved_at:
          type: string
          format: date-time
    StayPricePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items, notice, attribution_text, retrieved_at]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/StayPrice'
            notice:
              type: string
              description: Partner confirms the final price (FR-080).
            attribution_text:
              type: string
            retrieved_at:
              type: string
              format: date-time

    # ---- Study ----
    StudyTimingEvent:
      type: object
      additionalProperties: false
      required: [client_event_id, event, occurred_at, interface_locale]
      properties:
        client_event_id:
          type: string
          format: uuid
        session_log_id:
          type: [string, 'null']
          format: uuid
          description: Omitted on REQUEST_SUBMITTED (opens a log); required afterwards.
        event:
          type: string
          enum: [REQUEST_SUBMITTED, FIRST_PROPOSAL_DISPLAYED, SAVE_OUTCOME]
        occurred_at:
          type: string
          format: date-time
        interface_locale:
          $ref: '#/components/schemas/Locale'
        save_outcome:
          type: string
          enum: [SAVED, NOT_SAVED, SAVE_REFUSED]
    StudySessionLog:
      type: object
      required: [id, interface_locale]
      properties:
        id:
          type: string
          format: uuid
        interface_locale:
          $ref: '#/components/schemas/Locale'
        request_submitted_at:
          type: [string, 'null']
          format: date-time
        first_proposal_displayed_at:
          type: [string, 'null']
          format: date-time
        save_outcome:
          type: [string, 'null']
          enum: [SAVED, NOT_SAVED, SAVE_REFUSED, null]

    # ---- Admin ----
    CandidateSummary:
      type: object
      required: [id, city_id, slug, category_code, workflow_state, content_revision, updated_at]
      properties:
        id:
          type: string
          format: uuid
        city_id:
          type: string
          format: uuid
        slug:
          type: string
        category_code:
          type: string
        workflow_state:
          $ref: '#/components/schemas/WorkflowState'
        name_vi:
          type: [string, 'null']
        name_en:
          type: [string, 'null']
        content_revision:
          type: integer
        has_ai_draft:
          type: boolean
        provider_release:
          type: [string, 'null']
          description: Provider and release of the import run that created or last matched this candidate, e.g. `overture 2026-10-22.0` (OQ-112); null for manual or CSV-only candidates.
        gate_missing_count:
          type: integer
          minimum: 0
          description: Number of publication-gate violations (`fn_publication_gate_violations`); 0 means ready to publish (OQ-112).
        updated_at:
          type: string
          format: date-time
    CandidatePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CandidateSummary'
    Localization:
      type: object
      required: [locale, name, translation_origin, review_state]
      properties:
        id:
          type: string
          format: uuid
        locale:
          $ref: '#/components/schemas/Locale'
        name:
          type: string
          maxLength: 200
        short_description:
          type: [string, 'null']
          maxLength: 300
        description:
          type: [string, 'null']
          maxLength: 4000
        translation_origin:
          type: string
          enum: [ORIGINAL, HUMAN_TRANSLATION, AI_DRAFT]
        review_state:
          type: string
          enum: [DRAFT, APPROVED, REJECTED, SUPERSEDED]
        reviewed_at:
          type: [string, 'null']
          format: date-time
    CandidateFact:
      type: object
      required: [field_code, knowledge_state, review_state, source_revision_ids]
      properties:
        id:
          type: string
          format: uuid
        field_code:
          type: string
        knowledge_state:
          $ref: '#/components/schemas/KnowledgeState'
        value:
          type: [object, string, 'null']
        verified_at:
          type: [string, 'null']
          format: date
        review_state:
          type: string
          enum: [DRAFT, APPROVED, REJECTED, SUPERSEDED]
        conflict_state:
          type: string
          enum: [NONE, OPEN, RESOLVED]
        source_revision_ids:
          type: array
          items:
            type: string
            format: uuid
    CandidateDetail:
      allOf:
        - $ref: '#/components/schemas/CandidateSummary'
        - type: object
          required: [localizations, facts, publications]
          properties:
            location:
              $ref: '#/components/schemas/GeoPoint'
            visit_minutes_min:
              type: [integer, 'null']
            visit_minutes_suggested:
              type: [integer, 'null']
            visit_minutes_max:
              type: [integer, 'null']
            localizations:
              type: array
              items:
                $ref: '#/components/schemas/Localization'
            aliases:
              type: array
              items:
                type: object
                required: [locale, alias]
                properties:
                  locale:
                    $ref: '#/components/schemas/Locale'
                  alias:
                    type: string
                  review_state:
                    type: string
                    enum: [DRAFT, APPROVED, REJECTED]
            facts:
              type: array
              items:
                $ref: '#/components/schemas/CandidateFact'
            chunks:
              type: array
              description: Narrative chunks of the latest corpus revision, one per section and locale (ADR-010 0.3).
              items:
                $ref: '#/components/schemas/KnowledgeChunk'
            warnings:
              type: array
              description: Non-blocking review warnings, e.g. CHUNK_EMBEDDING_PENDING with the chunk id (ADR-012 0.3).
              items:
                type: object
                required: [code]
                properties:
                  code:
                    type: string
                  knowledge_chunk_id:
                    type: [string, 'null']
                    format: uuid
            publications:
              type: array
              items:
                $ref: '#/components/schemas/CatalogPublication'
    ChunkSection:
      type: string
      description: Citation unit of the Guide corpus (ADR-010 0.3).
      enum: [OVERVIEW, HISTORY, HIGHLIGHTS, VISIT_TIPS, ETIQUETTE, ACCESS]
    ChunkInput:
      type: object
      additionalProperties: false
      required: [locale, section, content, source_revision_ids]
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        section:
          $ref: '#/components/schemas/ChunkSection'
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: Original narrative text for this section; never operational facts (hours, prices, addresses).
        source_revision_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        review_state:
          type: string
          description: DRAFT (default) or APPROVED; approval is refused while the embedding is pending.
          enum: [DRAFT, APPROVED]
    KnowledgeChunk:
      type: object
      required: [id, locale, section, corpus_revision, content, review_state, embedding_state]
      properties:
        id:
          type: string
          format: uuid
        locale:
          $ref: '#/components/schemas/Locale'
        section:
          $ref: '#/components/schemas/ChunkSection'
        corpus_revision:
          type: integer
          minimum: 1
        content:
          type: string
        content_sha256:
          type: string
        source_revision_ids:
          type: array
          items:
            type: string
            format: uuid
        review_state:
          type: string
          enum: [DRAFT, APPROVED, RETIRED]
        embedding_state:
          type: string
          description: EMBEDDED when `embedding` and `embedding_model` are stored; PENDING after a gateway failure.
          enum: [EMBEDDED, PENDING]
        embedding_model:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    CandidateReview:
      type: object
      additionalProperties: false
      required: [expected_content_revision]
      properties:
        expected_content_revision:
          type: integer
          minimum: 0
        category_code:
          type: string
        visit_minutes_min:
          type: integer
          minimum: 5
        visit_minutes_suggested:
          type: integer
          minimum: 5
        visit_minutes_max:
          type: integer
          minimum: 5
        localizations:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/Localization'
        facts:
          type: array
          items:
            $ref: '#/components/schemas/CandidateFact'
        chunks:
          type: array
          maxItems: 12
          description: One narrative chunk per section and locale; replaces the section's chunk in the next corpus revision and is embedded on write (ADR-012 0.3).
          items:
            $ref: '#/components/schemas/ChunkInput'
        confirm_ai_draft_locales:
          type: array
          description: Locales whose AI_DRAFT content the curator confirms field by field (FR-019).
          items:
            $ref: '#/components/schemas/Locale'
    PublishRequest:
      type: object
      additionalProperties: false
      required: [expected_content_revision]
      properties:
        expected_content_revision:
          type: integer
          minimum: 0
    UnpublishRequest:
      type: object
      additionalProperties: false
      required: [state_reason]
      properties:
        state_reason:
          type: string
          minLength: 1
          maxLength: 500
    CatalogPublication:
      type: object
      required: [id, place_id, city_id, publication_revision, state, published_by_account_id, published_at]
      properties:
        id:
          type: string
          format: uuid
        place_id:
          type: string
          format: uuid
        city_id:
          type: string
          format: uuid
        publication_revision:
          type: integer
        state:
          type: string
          enum: [PUBLISHED, SUPERSEDED, WITHDRAWN]
        published_by_account_id:
          type: string
          format: uuid
        published_at:
          type: string
          format: date-time
        state_changed_at:
          type: [string, 'null']
          format: date-time
        state_reason:
          type: [string, 'null']
    ImportRun:
      type: object
      required: [id, data_provider_id, city_id, release_id, importer_version, status, started_at]
      properties:
        id:
          type: string
          format: uuid
        data_provider_id:
          type: string
          format: uuid
        provider_policy_id:
          type: string
          format: uuid
        city_id:
          type: string
          format: uuid
        release_id:
          type: string
        importer_version:
          type: string
        status:
          type: string
          enum: [RUNNING, SUCCEEDED, FAILED]
        record_count:
          type: [integer, 'null']
        accepted_count:
          type: [integer, 'null']
        rejected_count:
          type: [integer, 'null']
        duplicate_count:
          type: [integer, 'null']
          description: Records skipped because they matched an existing candidate or place (OQ-112).
        failure_code:
          type: [string, 'null']
          description: Machine-readable reason when `status` is FAILED, e.g. NO_ACTIVE_POLICY, CHECKSUM_MISMATCH, READ_ERROR, OUTSIDE_BOUNDING_BOX (OQ-112); null otherwise.
        started_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
    ImportRunPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ImportRun'
    SourceCreate:
      type: object
      additionalProperties: false
      required: [publisher, source_kind, attribution_text]
      properties:
        data_provider_id:
          type: [string, 'null']
          format: uuid
        publisher:
          type: string
          maxLength: 200
        source_kind:
          type: string
          enum: [OFFICIAL, OPEN_DATA, REFERENCE, OWN_OBSERVATION]
        homepage_url:
          type: [string, 'null']
          format: uri
        license_code:
          type: [string, 'null']
        attribution_text:
          type: string
          minLength: 1
          maxLength: 500
    Source:
      type: object
      required: [id, publisher, source_kind, attribution_text, created_at]
      properties:
        id:
          type: string
          format: uuid
        data_provider_id:
          type: [string, 'null']
          format: uuid
        publisher:
          type: string
        source_kind:
          type: string
          enum: [OFFICIAL, OPEN_DATA, REFERENCE, OWN_OBSERVATION]
        homepage_url:
          type: [string, 'null']
          format: uri
        license_code:
          type: [string, 'null']
        attribution_text:
          type: string
        created_at:
          type: string
          format: date-time
    SourcePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
