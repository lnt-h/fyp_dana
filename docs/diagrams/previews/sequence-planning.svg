s)</text><polyline points="920,808 650,808" fill="none" stroke="#527284" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="785" y="798" text-anchor="middle" font-size="13">9. provider-backed legs</text><rect x="1184" y="884" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="650,884 1190,884" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="920" y="874" text-anchor="middle" font-size="13">10. store preview / version snapshot</text><polyline points="650,960 380,960" fill="none" stroke="#527284" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="515" y="950" text-anchor="middle" font-size="13">11. preview + warnings</text><rect x="374" y="1036" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="110,1036 380,1036" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="245" y="1026" text-anchor="middle" font-size="13">12. Accept(preview)</text><rect x="644" y="1112" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="380,1112 650,1112" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="515" y="1102" text-anchor="middle" font-size="13">13. accept(pid, revision, key)</text><rect x="1184" y="1188" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="650,1188 1190,1188" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="920" y="1178" text-anchor="middle" font-size="13">14. revalidate; atomic plan persist</text><polyline points="650,1264 380,1264" fill="none" stroke="#527284" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="515" y="1254" text-anchor="middle" font-size="13">15. planned trip + revision</text><rect x="40" y="1290" width="1300" height="85" rx="8" fill="#fff7ed"/><text x="60" y="1320" font-size="14">AI cannot mutate trip rows. Provider calls outside transactions. Invalid/