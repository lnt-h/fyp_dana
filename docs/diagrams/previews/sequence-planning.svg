<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#075985"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" fill="#0F172A"><text x="40" y="42" font-size="24" font-weight="700">UC-05/06 — guest gate, build and Save &amp; customize</text><text x="40" y="70" font-size="14" fill="#475569">DaNavi v1.3 · one-day car plan</text><rect x="20" y="100" width="190" height="55" rx="12" fill="#E0F2FE" stroke="#075985" stroke-width="1.7"/><text x="115" y="132.5" text-anchor="middle" font-size="14" fill="#0F172A" font-weight="400">Traveler</text><line x1="115" y1="155" x2="115" y2="940" stroke="#94A3B8" stroke-dasharray="7 6"/><rect x="290" y="100" width="190" height="55" rx="12" fill="#E0F2FE" stroke="#075985" stroke-width="1.7"/><text x="385" y="132.5" text-anchor="middle" font-size="14" fill="#0F172A" font-weight="400">Mobile app</text><line x1="385" y1="155" x2="385" y2="940" stroke="#94A3B8" stroke-dasharray="7 6"/><rect x="560" y="100" width="190" height="55" rx="12" fill="#E0F2FE" stroke="#075985" stroke-width="1.7"/><text x="655" y="132.5" text-anchor="middle" font-size="14" fill="#0F172A" font-weight="400">API</text><line x1="655" y1="155" x2="655" y2="940" stroke="#94A3B8" stroke-dasharray="7 6"/><rect x="830" y="100" width="190" height="55" rx="12" fill="#E0F2FE" stroke="#075985" stroke-width="1.7"/><text x="925" y="132.5" text-anchor="middle" font-size="14" fill="#0F172A" font-weight="400">AI / Routes</text><line x1="925" y1="155" x2="925" y2="940" stroke="#94A3B8" stroke-dasharray="7 6"/><rect x="1100" y="100" width="190" height="55" rx="12" fill="#E0F2FE" stroke="#075985" stroke-width="1.7"/><text x="1195" y="132.5" text-anchor="middle" font-size="14" fill="#0F172A" font-weight="400">PostgreSQL</text><line x1="1195" y1="155" x2="1195" y2="940" stroke="#94A3B8" stroke-dasharray="7 6"/><line x1="115" y1="210" x2="385" y2="210" stroke="#075985" stroke-width="1.6" marker-end="url(#a)"/><rect x="176.39999999999998" y="193" width="147.20000000000002" height="20" fill="#fff"/><text x="250" y="208" text-anchor="middle" font-size="12">1. Generate preferences</text><line x1="385" y1="284" x2="115" y2="284" stroke="#075985" stroke-width="1.6" marker-end="url(#a)"/><rect x="112.4" y="267" width="275.2" height="20" fill="#fff"/><text x="250" y="282" text-anchor="middle" font-size="12">2. guest → login; preserve form; no AI call</text><line x1="115" y1="358" x2="385" y2="358" stroke="#075985" stroke-width="1.6" marker-end="url(#a)"/><rect x="166.8" y="341" width="166.4" height="20" fill="#fff"/><text x="250" y="356" text-anchor="middle" font-size="12">3. explicit Generate again</text><line x1="385" y1="432" x2="655" y2="432" stroke="#075985" stroke-width="1.6" marker-end="url(#a)"/><rect x="385.6" y="415" width="268.8" height="20" fill="#fff"/><text x="520" y="430" text-anchor="middle" font-size="12">4. build(day=1, car, start, revision, key)</text><line x1="655" y1="506" x2="1195" y2="506" stroke="#075985" stroke-width="1.6" marker-end="url(#a)"/><rect x="822.6" y="489" width="204.8" height="20" fill="#fff"/><text x="925" y="504" text-anchor="middle" font-size="12">5. authenticate; load candidates</text><line x1="655" y1="580" x2="925" y2="580" stroke="#075985" stroke-width="1.6" marker-end="url(#a)"/><rect x="681.2" y="563" width="217.60000000000002" height="20" fill="#fff"/><text x="790" y="578" text-anchor="middle" font-size="12">6. propose IDs/order; resolve legs</text><line x1="655" y1="654" x2="1195" y2="654" stroke="#075985" stroke-width="1.6" marker-end="url(#a)"/><rect x="832.2" y="637" width="185.60000000000002" height="20" fill="#fff"/><text x="925" y="652" text-anchor="middle" font-size="12">7. validate and store preview</text><line x1="655" y1="728" x2="385" y2="728" stroke="#075985" stroke-width="1.6" marker-end="url(#a)"/><rect x="452.8" y="711" width="134.4" height="20" fill="#fff"/><text x="520" y="726" text-anchor="middle" font-size="12">8. preview + warnings</text><line x1="115" y1="802" x2="385" y2="802" stroke="#075985" stroke-width="1.6" marker-end="url(#a)"/><rect x="189.2" y="785" width="121.60000000000001" height="20" fill="#fff"/><text x="250" y="800" text-anchor="middle" font-size="12">9. Save &amp; customize</text><line x1="655" y1="876" x2="1195" y2="876" stroke="#075985" stroke-width="1.6" marker-end="url(#a)"/><rect x="822.6" y="859" width="204.8" height="20" fill="#fff"/><text x="925" y="874" text-anchor="middle" font-size="12">10. atomic accept before editing</text><rect x="40" y="990" width="1320" height="80" rx="12" fill="#FEF3C7" stroke="#075985" stroke-width="1.7"/><text x="700" y="1035" text-anchor="middle" font-size="14" fill="#0F172A" font-weight="400">Provider calls stay outside transactions; invalid/stale previews preserve the prior accepted plan.</text></g></svg>