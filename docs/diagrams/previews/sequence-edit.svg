<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#527284"/></marker><marker id="open" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#527284"/></marker></defs><g font-family="Arial,sans-serif" fill="#172d3c"><rect width="100%" height="100%" fill="white"/><text x="40" y="40" font-size="24">UC-07 — edit and refresh (success path)</text><text x="40" y="72" font-size="15">BIZ-02 · FR-TRP-03/04 · stale response cannot overwrite a later revision</text><rect x="10" y="100" width="200" height="60" fill="#f1f7fa" stroke="#27485b"/><text x="110" y="135" text-anchor="middle" font-size="14">traveler : Traveler</text><line x1="110" y1="160" x2="110" y2="870" stroke="#a5b6c1" stroke-dasharray="7 6"/><rect x="280" y="100" width="200" height="60" fill="#f1f7fa" stroke="#27485b"/><text x="380" y="135" text-anchor="middle" font-size="14">app : MobileApp</text><line x1="380" y1="160" x2="380" y2="870" stroke="#a5b6c1" stroke-dasharray="7 6"/><rect x="550" y="100" width="200" height="60" fill="#f1f7fa" stroke="#27485b"/><text x="650" y="135" text-anchor="middle" font-size="14">api : Trips/Routing</text><line x1="650" y1="160" x2="650" y2="870" stroke="#a5b6c1" stroke-dasharray="7 6"/><rect x="820" y="100" width="200" height="60" fill="#f1f7fa" stroke="#27485b"/><text x="920" y="135" text-anchor="middle" font-size="14">provider : Routes</text><line x1="920" y1="160" x2="920" y2="870" stroke="#a5b6c1" stroke-dasharray="7 6"/><rect x="1090" y="100" width="200" height="60" fill="#f1f7fa" stroke="#27485b"/><text x="1190" y="135" text-anchor="middle" font-size="14">db : PostgreSQL</text><line x1="1190" y1="160" x2="1190" y2="870" stroke="#a5b6c1" stroke-dasharray="7 6"/><rect x="374" y="200" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="110,200 380,200" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="245" y="190" text-anchor="middle" font-size="13">1. Reorder unvisited stops</text><rect x="644" y="276" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="380,276 650,276" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="515" y="266" text-anchor="middle" font-size="13">2. order(all IDs, revision)</text><rect x="1184" y="352" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="650,352 1190,352" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="920" y="342" text-anchor="middle" font-size="13">3. owner/member/state/revision check</text><rect x="1184" y="428" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="650,428 1190,428" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="920" y="418" text-anchor="middle" font-size="13">4. atomic order; revision++; legs stale</text><polyline points="650,504 380,504" fill="none" stroke="#527284" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="515" y="494" text-anchor="middle" font-size="13">5. saved order / stale routes</text><rect x="644" y="580" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="380,580 650,580" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="515" y="570" text-anchor="middle" font-size="13">6. refreshRoute(revision)</text><rect x="914" y="656" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="650,656 920,656" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="785" y="646" text-anchor="middle" font-size="13">7. resolve affected start/stop legs</text><polyline points="920,732 650,732" fill="none" stroke="#527284" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="785" y="722" text-anchor="middle" font-size="13">8. legs or unavailable</text><rect x="1184" y="808" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="650,808 1190,808" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="920" y="798" text-anchor="middle" font-size="13">9. apply only if revision matches</text><polyline points="650,884 380,884" fill="none" stroke="#527284" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="515" y="874" text-anchor="middle" font-size="13">10. fresh / unavailable / conflict</text><rect x="40" y="910" width="1300" height="85" rx="8" fill="#fff7ed"/><text x="60" y="940" font-size="14">Completed/current prefix immutable. Durations null while stale/unavailable. First-stop edit invalidates the day start leg too.</text></g></svg>