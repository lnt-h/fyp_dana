<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1172"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#527284"/></marker><marker id="open" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#527284"/></marker></defs><g font-family="Arial,sans-serif" fill="#172d3c"><rect width="100%" height="100%" fill="white"/><text x="40" y="40" font-size="24">UC-11 — contextual RAG (sufficient-evidence path)</text><text x="40" y="72" font-size="15">BIZ-04 · FR-AI-01 · unsupported or conflicting evidence returns refusal</text><rect x="10" y="100" width="200" height="60" fill="#f1f7fa" stroke="#27485b"/><text x="110" y="135" text-anchor="middle" font-size="14">traveler : Traveler</text><line x1="110" y1="160" x2="110" y2="1022" stroke="#a5b6c1" stroke-dasharray="7 6"/><rect x="280" y="100" width="200" height="60" fill="#f1f7fa" stroke="#27485b"/><text x="380" y="135" text-anchor="middle" font-size="14">app : MobileApp</text><line x1="380" y1="160" x2="380" y2="1022" stroke="#a5b6c1" stroke-dasharray="7 6"/><rect x="550" y="100" width="200" height="60" fill="#f1f7fa" stroke="#27485b"/><text x="650" y="135" text-anchor="middle" font-size="14">api : AI module</text><line x1="650" y1="160" x2="650" y2="1022" stroke="#a5b6c1" stroke-dasharray="7 6"/><rect x="820" y="100" width="200" height="60" fill="#f1f7fa" stroke="#27485b"/><text x="920" y="135" text-anchor="middle" font-size="14">model : Provider</text><line x1="920" y1="160" x2="920" y2="1022" stroke="#a5b6c1" stroke-dasharray="7 6"/><rect x="1090" y="100" width="200" height="60" fill="#f1f7fa" stroke="#27485b"/><text x="1190" y="135" text-anchor="middle" font-size="14">db : PostgreSQL</text><line x1="1190" y1="160" x2="1190" y2="1022" stroke="#a5b6c1" stroke-dasharray="7 6"/><rect x="374" y="200" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="110,200 380,200" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="245" y="190" text-anchor="middle" font-size="13">1. Ask(question)</text><rect x="644" y="276" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="380,276 650,276" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="515" y="266" text-anchor="middle" font-size="13">2. ask(place/trip, locale)</text><rect x="1184" y="352" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="650,352 1190,352" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="920" y="342" text-anchor="middle" font-size="13">3. authorise; load facts/allowlist</text><rect x="914" y="428" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="650,428 920,428" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="785" y="418" text-anchor="middle" font-size="13">4. embed(query, pinned config)</text><polyline points="920,504 650,504" fill="none" stroke="#527284" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="785" y="494" text-anchor="middle" font-size="13">5. compatible query vector</text><rect x="1184" y="580" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="650,580 1190,580" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="920" y="570" text-anchor="middle" font-size="13">6. filtered reviewed chunk search</text><polyline points="1190,656 650,656" fill="none" stroke="#527284" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="920" y="646" text-anchor="middle" font-size="13">7. evidence passages/sources</text><rect x="644" y="732" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="650,732 720,732 720,762 650,762" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="666" y="722"  font-size="13">8. check relevance/conflicts</text><rect x="914" y="808" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="650,808 920,808" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="785" y="798" text-anchor="middle" font-size="13">9. grounded generation(allowed IDs)</text><polyline points="920,884 650,884" fill="none" stroke="#527284" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="785" y="874" text-anchor="middle" font-size="13">10. structured draft answer</text><rect x="644" y="960" width="12" height="38" fill="#dbeaf0" stroke="#7295a7"/><polyline points="650,960 720,960 720,990 650,990" fill="none" stroke="#527284" stroke-width="1.7"  marker-end="url(#arrow)"/><text x="666" y="950"  font-size="13">11. validate format/IDs/operational facts</text><polyline points="650,1036 380,1036" fill="none" stroke="#527284" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="515" y="1026" text-anchor="middle" font-size="13">12. answer + supporting sources</text><rect x="40" y="1062" width="1300" height="85" rx="8" fill="#fff7ed"/><text x="60" y="1092" font-size="14">No model DB mutation/tools. Valid citation IDs do not prove support; held-out claim review is required. Empty/weak evidence returns</text><text x="60" y="1116" font-size="14">insufficient_evidence.</text></g></svg>