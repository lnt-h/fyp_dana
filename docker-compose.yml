# Local development stack (db + api). Production uses docker-compose.prod.yml (see infra/README.md).
#
# Settings: the api container reads infra/dev.env (committed development defaults) and then
# apps/api/.env (your local overrides, optional), so GONARRA_ENVIRONMENT and every other
# GONARRA_* value come from those files rather than being hard-coded here. Only the database
# URL is set below, because apps/api/.env points at localhost for a host-run uvicorn.
# Compose-level knobs use ${VAR:-default} and can be overridden from the shell.
services:
  db:
    build:
      context: ./infra/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gonarra}
      POSTGRES_USER: ${POSTGRES_USER:-gonarra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gonarra}
    ports:
      # Loopback only: the dev password is not secret, so never expose it on the LAN.
      - "127.0.0.1:${GONARRA_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - gonarra-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    env_file:
      - path: ./infra/dev.env
        required: true
      - path: ./apps/api/.env
        required: false
    environment:
      GONARRA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gonarra}:${POSTGRES_PASSWORD:-gonarra}@db:5432/${POSTGRES_DB:-gonarra}
    ports:
      - "${GONARRA_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  gonarra-postgres:
