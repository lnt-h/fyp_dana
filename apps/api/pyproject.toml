[project]
name = "gonarra-api"
version = "0.1.0"
description = "Backend API for the Gonarra itinerary planner"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agno==3.1.12",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "google-genai>=1.0",
  "groq>=0.20",
  "httpx>=0.28,<1",
  "ortools>=9.11",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0.37,<3",
  "sse-starlette>=2.1",
  "tavily-python>=0.5",
  "trafilatura>=2.0",
  "typer>=0.15",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "import-linter>=2.0",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "pytest-httpx>=0.35",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers -m 'not integration'"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires the local PostgreSQL service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.importlinter]
root_package = "app"
include_external_packages = false

# Architecture §2 import rules, limited to modules that exist today. Add the guide contracts when
# that package lands. Only the planning orchestrator (app.planning.orchestrator) may call the
# agent roles and research adapters; the rest of planning and trips never import them.
[[tool.importlinter.contracts]]
name = "Schemas and models do not import the HTTP layer"
type = "forbidden"
source_modules = ["app.schemas", "app.models"]
forbidden_modules = ["app.api", "app.main"]

[[tool.importlinter.contracts]]
name = "Database plumbing does not import the HTTP layer or repositories"
type = "forbidden"
source_modules = ["app.db"]
forbidden_modules = ["app.api", "app.main", "app.repositories"]

[[tool.importlinter.contracts]]
name = "Security does not import the HTTP layer"
type = "forbidden"
source_modules = ["app.security"]
forbidden_modules = ["app.api", "app.main"]

[[tool.importlinter.contracts]]
name = "Observability does not import the HTTP layer or persistence"
type = "forbidden"
source_modules = ["app.observability"]
forbidden_modules = ["app.api", "app.main", "app.db", "app.repositories"]

[[tool.importlinter.contracts]]
name = "Catalog repositories do not import the HTTP layer or AI code"
type = "forbidden"
source_modules = ["app.catalog"]
forbidden_modules = ["app.api", "app.main", "app.ai", "app.agents"]

[[tool.importlinter.contracts]]
name = "Curation does not import the HTTP layer or agents"
type = "forbidden"
source_modules = ["app.curation"]
forbidden_modules = ["app.api", "app.main", "app.agents"]

[[tool.importlinter.contracts]]
name = "Ingestion does not import the HTTP layer or agents"
type = "forbidden"
source_modules = ["app.ingestion"]
forbidden_modules = ["app.api", "app.main", "app.agents"]

[[tool.importlinter.contracts]]
name = "AI providers do not import the HTTP layer"
type = "forbidden"
source_modules = ["app.ai"]
forbidden_modules = ["app.api", "app.main"]

[[tool.importlinter.contracts]]
name = "Routing does not import agents, AI providers or the HTTP layer"
type = "forbidden"
source_modules = ["app.routing"]
forbidden_modules = ["app.api", "app.main", "app.agents", "app.ai.providers"]
# Routing may use app.ai.quota (ROUTES_ELEMENTS ledger), which itself imports app.ai.providers;
# the rule is about routing's own imports, so only direct imports are checked.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Routing never imports the planner or the solver"
type = "forbidden"
source_modules = ["app.routing"]
forbidden_modules = ["app.planning", "app.trips"]

[[tool.importlinter.contracts]]
name = "Solver is pure: no routing, DB, AI, agents or HTTP"
type = "forbidden"
source_modules = ["app.planning.solver"]
forbidden_modules = [
  "app.api",
  "app.main",
  "app.agents",
  "app.ai",
  "app.routing",
  "app.db",
  "app.models",
  "app.repositories",
  "app.catalog",
  "app.curation",
  "app.trips",
]

[[tool.importlinter.contracts]]
name = "Trips and planning do not import the HTTP layer or agents (except the orchestrator)"
type = "forbidden"
source_modules = ["app.trips", "app.planning"]
forbidden_modules = ["app.api", "app.main", "app.agents", "app.research"]
ignore_imports = [
  "app.planning.orchestrator -> app.agents.*",
  "app.planning.orchestrator -> app.research.*",
]

[[tool.importlinter.contracts]]
name = "Agents import only app.ai, app.config and their own modules (architecture §2)"
type = "forbidden"
source_modules = ["app.agents"]
forbidden_modules = [
  "app.api",
  "app.main",
  "app.db",
  "app.models",
  "app.repositories",
  "app.catalog",
  "app.curation",
  "app.ingestion",
  "app.planning",
  "app.research",
  "app.routing",
  "app.trips",
  "app.security",
]

[[tool.importlinter.contracts]]
name = "AI infrastructure does not import agents or research"
type = "forbidden"
source_modules = ["app.ai"]
forbidden_modules = ["app.agents", "app.research"]

[[tool.importlinter.contracts]]
name = "Research adapters do not import the HTTP layer or the planner"
type = "forbidden"
source_modules = ["app.research"]
forbidden_modules = ["app.api", "app.main", "app.planning", "app.trips"]

[[tool.importlinter.contracts]]
name = "Calendar rules and Plan Health are pure code (no AI, HTTP, DB, curation or routing)"
type = "forbidden"
source_modules = ["app.planning.calendar", "app.planning.health"]
forbidden_modules = [
  "app.agents",
  "app.ai",
  "app.api",
  "app.main",
  "app.db",
  "app.repositories",
  "app.curation",
  "app.routing",
  "app.planning.workflows",
  "app.planning.orchestrator",
]
